<style>:root{--ink:#0E0F12;--hair:#2B2D33;--cream:#F1EDE4;--mute:#9A9EA8;--dim:#6F737C;--blue:#2E7CE6;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--cream);font:500 17px/1.6 "Saira Semi Condensed","Arial Narrow",system-ui,sans-serif;-webkit-font-smoothing:antialiased}

.top{display:flex;justify-content:space-between;align-items:center;padding-top:26px;padding-bottom:26px}
.top a{color:var(--cream)}.top svg{height:15px;display:block}
.top .caps{font:600 11px/1 "Saira Semi Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);text-decoration:none}

h1{font:700 clamp(44px,8vw,72px)/.95 "Saira Semi Condensed",sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:0 0 14px}
h2{font:700 15px/1.2 "Saira Semi Condensed",sans-serif;text-transform:uppercase;letter-spacing:.12em;color:var(--cream);margin:44px 0 10px;padding-top:18px;border-top:1px solid var(--hair)}

footer{border-top:1px solid var(--hair);padding-top:22px;padding-bottom:40px;color:var(--dim);font-size:13px;display:flex;gap:18px;flex-wrap:wrap}

.share h1{font-size:clamp(38px,7vw,60px);margin-bottom:22px}.share .who{font:600 12px/1 "Saira Semi Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:14px}
.share .route{border-radius:20px;background:#15171B;box-shadow:inset 0 0 0 1px var(--hair);margin:6px 0 24px;overflow:hidden}.share .route svg{display:block;width:100%;height:auto}

<body>
<div class="top"><a href="/"><svg viewBox="0 0 724 240" aria-label="Kaia"><path fill="none" stroke="currentColor" stroke-width="28" stroke-linecap="round" d="M14 14L14 96M14 144L14 226M50 106L134 14M50 140L134 226M270 14L342 14M246 38L246 96M366 38L366 96M270 120L342 120M246 144L246 226M366 144L366 226M478 14L478 96M478 144L478 226M614 14L686 14M590 38L590 96M710 38L710 96M614 120L686 120M590 144L590 226M710 144L710 226"/></svg></a><a class="caps" href="https://testflight.apple.com/join/sGENjmfT" rel="noopener">Join the beta</a></div>
<main>
<div id="share" class="share" hidden>
  <div class="caps who" id="who"></div>
  <h1 id="what"></h1>
  <div class="route" id="routeBox" hidden><svg id="route" viewBox="0 0 600 360" preserveAspectRatio="xMidYMid meet" aria-label="The route"></svg></div>
  <dl class="figs" id="figs"></dl>
  <p class="line" id="line"></p>
  <div class="ctas">
    <a class="btn" id="open" href="#">Open in Kaia</a>
    <a class="btn ghost" href="https://testflight.apple.com/join/sGENjmfT" rel="noopener">Get Kaia</a>
  </div>
  <p class="hint">Opened from Mail, Slack or anywhere else: Open in Kaia takes it straight to the app.</p>
</div>
<div id="empty" class="share" hidden>
  <h1>Nothing to show</h1>
  <p class="line">This link is missing what was shared. Ask whoever sent it to send it again from Kaia.</p>
  <div class="ctas"><a class="btn" href="/">About Kaia</a></div>
</div>
<script>
// What a friend sent, read from the end of the link (after "#"), which the browser never sends
// anywhere: base64url, raw DEFLATE, JSON. Drawn here for people who don't have Kaia yet.
(async function(){
  const show=id=>document.getElementById(id).hidden=false;
  const frag=location.hash.slice(1);
  if(!frag.startsWith("1.")||!("DecompressionStream" in window)){ show("empty"); return }
  let share;
  try{
    let b=frag.slice(2).replace(/-/g,"+").replace(/_/g,"/"); while(b.length%4) b+="=";
    const bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));
    const text=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
    share=JSON.parse(text);
  }catch(e){ show("empty"); return }
  const name=(share.from&&share.from.name)||"A friend", r=share.route, m=share.meet;
  const mi=v=>(v/1609.34).toFixed(v<16093?1:0);
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const fig=(v,l)=>`<div><dd>${esc(v)}</dd><dt>${esc(l)}</dt></div>`;
  const who=document.getElementById("who"), what=document.getElementById("what"), figs=document.getElementById("figs"), line=document.getElementById("line");
  if(m){
    who.textContent=`${name} wants to meet`;
    what.textContent=m.place;
    const at=new Date(m.at);
    figs.innerHTML=fig(at.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}),at.toLocaleDateString([], {weekday:"long",month:"short",day:"numeric"}))+(m.detail?fig(m.detail,"Where"):"");
    line.textContent=m.note?`“${m.note}”`:"Open it in Kaia and it plans your drive there from your place.";
  } else if(r){
    who.textContent= r.kind==="together"?`A drive with ${name}`: r.kind==="drove"?`${name} drove your road`:`${name} sent you a road`;
    what.textContent=r.title==="A drive"?"A drive":r.title.replace(/^via /,"Via ");
    const notes=(r.notes||[]).length;
    figs.innerHTML=fig(mi(r.meters)+" mi","Distance")+(r.sky?fig(r.sky,"Light"):"")+(notes?fig(notes,notes===1?"Note on the way":"Notes on the way"):"");
    line.textContent= r.kind==="route"?"Open it in Kaia and it starts from your place, with the notes along the way.":"Open it in Kaia to keep it with your drives.";
    drawRoute(r.points||[], r.notes||[]);
  } else {
    who.textContent=`${name} is on Kaia`;
    what.textContent=name;
    const f=k=>(share.from.figures||[]).find(x=>x.key===k);
    const d=f("distance"), n=f("drives"), rd=f("roads"), fav=f("road");
    figs.innerHTML=(d?fig(Math.round(d.number/1609.34).toLocaleString(),"Miles"):"")+(n?fig(n.number,"Drives"):"")+(rd?fig(rd.number,"Roads"):"")+(fav&&fav.text?fig(fav.text,"Favourite road"):"");
    line.textContent="Open it in Kaia to add them as a friend.";
  }
  document.title=`${who.textContent} · Kaia`;
  // The same share for the app itself: works from any app's browser, where a trykaia.app link
  // can't hand itself to Kaia.
  document.getElementById("open").href="kaia://s/#"+frag;
  show("share");

  function drawRoute(pts, notes){
    if(pts.length<2) return;
    const lat0=pts.reduce((s,p)=>s+p[0],0)/pts.length, kx=Math.cos(lat0*Math.PI/180);
    const xy=pts.map(p=>[p[1]*kx,-p[0]]), all=xy.concat(notes.map(n=>[n.longitude*kx,-n.latitude]));
    const xs=all.map(p=>p[0]), ys=all.map(p=>p[1]);
    const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
    // the box takes the route's own shape: tall for a tall route, wide for a wide one
    const W=600, H=Math.round(Math.min(680,Math.max(300,(W-68)*((y1-y0)/((x1-x0)||1e-9))+68))), pad=34, s=Math.min((W-2*pad)/((x1-x0)||1e-9),(H-2*pad)/((y1-y0)||1e-9));
    document.getElementById("route").setAttribute("viewBox",`0 0 ${W} ${H}`);
    const ox=(W-(x1-x0)*s)/2, oy=(H-(y1-y0)*s)/2, P=([x,y])=>[ox+(x-x0)*s, oy+(y-y0)*s];
    const d=xy.map((p,i)=>{ const q=P(p); return (i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1) }).join("");
    const a=P(xy[0]), b=P(xy[xy.length-1]);
    document.getElementById("route").innerHTML=`<defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"><stop offset="0" stop-color="#2FBF71"/><stop offset=".25" stop-color="#1FB5A6"/><stop offset=".5" stop-color="#2E7CE6"/><stop offset=".75" stop-color="#5B5BD6"/><stop offset="1" stop-color="#8B4FD9"/></linearGradient></defs>
      <path d="${d}" fill="none" stroke="#000" stroke-opacity=".5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="${d}" fill="none" stroke="url(#g)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${notes.map(n=>{ const q=P([n.longitude*kx,-n.latitude]); return `<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="5" fill="#F1EDE4" stroke="#0E0F12" stroke-width="2"/>` }).join("")}
      <circle cx="${a[0]}" cy="${a[1]}" r="6.5" fill="#0E0F12" stroke="#F1EDE4" stroke-width="3"/><circle cx="${b[0]}" cy="${b[1]}" r="6.5" fill="#2E7CE6" stroke="#fff" stroke-width="2.5"/>`;
    show("routeBox");
  }
})();
</script>
</main>
<footer><span>Kaia · made in Pittsburgh</span><a href="/">Home</a><a href="/privacy/">Privacy</a><a href="/support/">Support</a></footer>
